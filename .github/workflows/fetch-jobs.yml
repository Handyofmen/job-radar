name: Fetch Job Radar Feed

on:
  workflow_dispatch: {}

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install

      - name: Run job radar
        env:
          JOOBLE_API_KEY: ${{ secrets.JOOBLE_API_KEY }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
        run: node scripts/run.js

      - name: Commit updated feed
        run: |
          git config user.name "job-radar-bot"
          git config user.email "actions@github.com"
          git add data/jobs-nigeria.json data/jobs-international.json data/seen-jobs-nigeria.json data/seen-jobs-international.json
          git commit -m "Update job feed [skip ci]" || echo "No changes"
          git push